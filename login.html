<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ConectaSocial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-header">
            <div class="logo">
                <i class="fa-solid fa-wifi"></i>
                <span>ConectaSocial</span>
            </div>
            <p>Gestão para provedores, equipe técnica e clientes</p>
        </div>

        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="tipoUsuario">Perfil de acesso</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user-gear input-icon"></i>
                    <select id="tipoUsuario" required>
                        <option value="" disabled selected>Selecione seu perfil</option>
                        <option value="GESTOR">Provedor</option>
                        <option value="TECNICO">Técnico</option>
                        <option value="CLIENTE">Cliente</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope input-icon"></i>
                    <input type="email" id="email" placeholder="Digite seu e-mail" required>
                </div>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="senha" placeholder="Digite sua senha" required>
                    <i class="fa-regular fa-eye toggle-password" id="togglePassword"></i>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="remember">
                    <span>Lembrar de mim</span>
                </label>
                <a href="#" class="forgot-password" id="forgotPasswordBtn">Esqueceu a senha?</a>
            </div>

            <p id="loginFeedback" class="login-feedback" role="alert"></p>

            <button type="submit" class="btn-submit">
                <span>Entrar no sistema</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="login-footer">
            <p>Ainda não tem conta de cliente? <a href="views/cadastro.php">Criar cadastro</a></p>
            <p class="muted" style="margin-top:8px">Demonstração: admin@conectasocial.com, tecnico@conectasocial.com ou cliente@conectasocial.com — senha 123456</p>
        </div>
    </div>

    <script src="assets/js/login.js"></script>
</body>
</html>
